[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  external_node_modules = ["nodemailer"]
[functions."scheduled-automations"]
  schedule = "@hourly"


[[redirects]]
  from = "/terms"
  to = "/terms/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/termos"
  to = "/termos/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/confirm-booking"
  to = "/.netlify/functions/confirm-booking"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin-users"
  to = "/.netlify/functions/admin-users"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin-session"
  to = "/.netlify/functions/admin-session"
  status = 200
  force = true

[[redirects]]
  from = "/api/data/*"
  to = "/.netlify/functions/data"
  status = 200
  force = true

[[redirects]]
  from = "/api/voice"
  to = "/.netlify/functions/voice"
  status = 200
  force = true

[[redirects]]
  from = "/api/agent/*"
  to = "/.netlify/functions/agent"
  status = 200
  force = true

[[redirects]]
  from = "/api/sms"
  to = "/.netlify/functions/sms"
  status = 200
  force = true

[[redirects]]
  from = "/api/diagnostics"
  to = "/.netlify/functions/diagnostics"
  status = 200
  force = true

[[redirects]]
  from = "/api/voice-lead"
  to = "/.netlify/functions/voice-lead"
  status = 200
  force = true

[[redirects]]
  from = "/api/notify-lead"
  to = "/.netlify/functions/notify-lead"
  status = 200
  force = true

[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/leads"
  status = 200
  force = true

[[redirects]]
  from = "/api/chat-lead"
  to = "/.netlify/functions/chat-lead"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
