<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Dany Clean Pro — Residential &amp; Commercial Cleaning in Connecticut</title>
    <meta
      name="description"
      content="Family-owned residential and commercial cleaning based in Waterbury and serving homes and businesses across Connecticut. Over five years and more than 3,000 clients."
    />

    <!-- The brand mark, transparent, so it sits on a light or a dark tab. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f172a" />

    <!-- What a shared link looks like in a message or a post. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dany Clean Pro" />
    <meta property="og:title" content="Dany Clean Pro — Residential &amp; Commercial Cleaning in Connecticut" />
    <meta property="og:description" content="Family-owned residential and commercial cleaning based in Waterbury, serving homes and businesses across Connecticut." />
    <!-- A link preview is composited by whoever shows it, and transparency
         gets filled — usually with black. This one carries its own
         background and the 1200x630 shape every platform crops to. -->
    <meta property="og:image" content="https://danycleanpro.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://danycleanpro.com/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Meta Pixel. Not on the admin panel: the owner's own visits would be
         counted as customers. Page changes after this one are reported from
         src/lib/metaPixel.ts. -->
    <script>
      if (!location.pathname.startsWith('/admin')) {
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1096937758561129');
        fbq('track', 'PageView');
      }
    </script>
  </head>
  <body>
    <noscript><img height="1" width="1" style="display:none" alt=""
      src="https://www.facebook.com/tr?id=1096937758561129&ev=PageView&noscript=1"
    /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
