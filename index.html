<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The cover photo is the largest thing on the home page's first screen.
         Asked for here, while the page is still arriving, instead of after
         the JavaScript has run. The URLs must be exactly the ones the <img>
         in src/components/home/Hero.tsx asks for (src/lib/images.ts builds
         them, src/lib/heroCover.ts holds the widths and quality), or the
         browser downloads the picture twice. %HERO_COVER_FILE% is filled in
         at build time from src/generated/heroCover.ts. -->
    <script>
      (function () {
        if (location.pathname !== '/') return;
        var file = '%HERO_COVER_FILE%';
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.setAttribute('fetchpriority', 'high');
        var host = location.hostname;
        if (host === 'danycleanpro.com' || host === 'www.danycleanpro.com' || /\.netlify\.app$/.test(host)) {
          var copy = function (w) { return '/.netlify/images?url=' + encodeURIComponent(file) + '&w=' + w + '&q=65'; };
          link.setAttribute('imagesrcset', [640, 960, 1280, 1920].map(function (w) { return copy(w) + ' ' + w + 'w'; }).join(', '));
          link.setAttribute('imagesizes', '100vw');
          link.href = copy(1280);
        } else {
          link.href = file;
        }
        document.head.appendChild(link);
      })();
    </script>

    <!-- Poppins is served from this site (see src/index.css); these two
         weights carry the first screen's headline and buttons. -->
    <link rel="preload" href="/fonts/poppins-latin-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-latin-600.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Figtree, for the dashboard and the policy pages, without holding up
         the first paint: the stylesheet applies once it has arrived. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" /></noscript>
    <title>Dany Clean Pro — Residential &amp; Commercial Cleaning in Connecticut</title>
    <meta
      name="description"
      content="Family-owned residential and commercial cleaning based in Waterbury and serving homes and businesses across Connecticut. Over five years and more than 3,000 clients."
    />

    <!-- The brand mark, transparent, so it sits on a light or a dark tab. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f172a" />

    <!-- What a shared link looks like in a message or a post. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dany Clean Pro" />
    <meta property="og:title" content="Dany Clean Pro — Residential &amp; Commercial Cleaning in Connecticut" />
    <meta property="og:description" content="Family-owned residential and commercial cleaning based in Waterbury, serving homes and businesses across Connecticut." />
    <!-- A link preview is composited by whoever shows it, and transparency
         gets filled — usually with black. This one carries its own
         background and the 1200x630 shape every platform crops to. -->
    <meta property="og:image" content="https://danycleanpro.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://danycleanpro.com/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Meta Pixel. Not on the admin panel: the owner's own visits would be
         counted as customers. Page changes after this one are reported from
         src/lib/metaPixel.ts. -->
    <script>
      if (!location.pathname.startsWith('/admin')) {
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1096937758561129');
        fbq('track', 'PageView');
      }
    </script>
  </head>
  <body>
    <noscript><img height="1" width="1" style="display:none" alt=""
      src="https://www.facebook.com/tr?id=1096937758561129&ev=PageView&noscript=1"
    /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
